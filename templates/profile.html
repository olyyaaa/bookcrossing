 
{% extends "base.html" %}
{% block title %}Профіль — Буккросинг{% endblock %}
{% block content %}
<div class="container" style="padding-top:2rem;">
  <div id="profile-container">
    <div class="spinner"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
if (!isLoggedIn()) window.location.href = '/login';

async function loadProfile() {
  const res = await apiGet('/users/me');
  if (!res || !res.ok) return;

  const user = await res.json();
  setUser(user);

  document.getElementById('profile-container').innerHTML = `
    <div class="profile-header">
      <div class="avatar">${user.name.charAt(0).toUpperCase()}</div>
      <div>
        <h2 style="margin-bottom:4px;">${user.name}</h2>
        <p class="text-muted">${user.email}</p>
        ${user.city ? `<p class="text-muted">📍 ${user.city}</p>` : ''}
        <span class="badge ${user.role === 'admin' ? 'badge-warning' : 'badge-success'}">
          ${user.role === 'admin' ? '👑 Адміністратор' : '👤 Учасник'}
        </span>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <h3 class="mb-2">✏️ Редагувати профіль</h3>
        <div id="edit-alert"></div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Ім'я</label>
            <input type="text" id="edit-name" class="form-control" value="${user.name}">
          </div>
          <div class="form-group">
            <label class="form-label">Місто</label>
            <input type="text" id="edit-city" class="form-control" value="${user.city || ''}">
          </div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="updateProfile()">Зберегти зміни</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('my-books', this)">📚 Мої книги</button>
      <button class="tab-btn" onclick="switchTab('notifications', this)">🔔 Сповіщення</button>
    </div>

    <div id="tab-my-books">
      <div id="my-books-container" class="grid-4"></div>
    </div>

    <div id="tab-notifications" style="display:none;">
      <div class="d-flex justify-between align-center mb-2">
        <h3>Сповіщення</h3>
        <button class="btn btn-sm btn-outline" onclick="markAllRead()">Позначити всі як прочитані</button>
      </div>
      <div id="notifications-container"></div>
    </div>
  `;

  loadMyBooks();
  loadNotifications();
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-my-books').style.display = tab === 'my-books' ? 'block' : 'none';
  document.getElementById('tab-notifications').style.display = tab === 'notifications' ? 'block' : 'none';
}

async function updateProfile() {
  const name = document.getElementById('edit-name').value.trim();
  const city = document.getElementById('edit-city').value.trim();

  const res = await apiPut('/users/me', { name, city });
  if (res && res.ok) {
    const user = await res.json();
    setUser(user);
    showAlert('edit-alert', 'Профіль оновлено!', 'success');
  } else {
    showAlert('edit-alert', 'Помилка оновлення');
  }
}

async function loadMyBooks() {
  const user = getUser();
  if (!user) return;

  const res = await apiGet(`/books/?`, false);
  if (!res || !res.ok) return;

  const allBooks = await res.json();
  const myBooks = allBooks.filter(b => b.owner_id === user.id);
  const container = document.getElementById('my-books-container');

  if (myBooks.length === 0) {
    container.innerHTML = '<p class="text-muted">У вас ще немає книг. <a href="/add-book" style="color:#4f6ef7;">Додати книгу</a></p>';
    return;
  }

  container.innerHTML = myBooks.map(book => `
    <div class="card book-card" onclick="window.location.href='/book/${book.id}'">
      <div class="card-img">
        ${book.photo_url ? `<img src="${book.photo_url}" style="width:100%;height:100%;object-fit:cover;">` : '📖'}
      </div>
      <div class="card-body">
        <div class="book-title">${book.title}</div>
        <div class="book-author">${book.author}</div>
        ${getStatusBadge(book.status)}
      </div>
    </div>
  `).join('');
}

async function loadNotifications() {
  const res = await apiGet('/notifications/');
  if (!res || !res.ok) return;

  const notifs = await res.json();
  const container = document.getElementById('notifications-container');

  if (notifs.length === 0) {
    container.innerHTML = '<p class="text-muted">Сповіщень немає</p>';
    return;
  }

  container.innerHTML = notifs.map(n => `
    <div class="card mb-2" style="${!n.is_read ? 'border-left:4px solid #4f6ef7;' : ''}">
      <div class="card-body d-flex justify-between align-center">
        <div>
          <p style="${!n.is_read ? 'font-weight:600;' : ''}">${n.message}</p>
          <span class="text-muted">${formatDate(n.created_at)}</span>
        </div>
        ${!n.is_read ? `<button class="btn btn-sm btn-outline" onclick="markRead(${n.id}, this)">Прочитано</button>` : ''}
      </div>
    </div>
  `).join('');
}

async function markRead(id, btn) {
  const res = await apiPatch(`/notifications/${id}/read`);
  if (res && res.ok) {
    btn.closest('.card').style.borderLeft = 'none';
    btn.remove();
    loadNotifCount();
  }
}

async function markAllRead() {
  const res = await apiPatch('/notifications/read-all');
  if (res && res.ok) {
    loadNotifications();
    loadNotifCount();
  }
}

loadProfile();
</script>
{% endblock %}
