 {% extends "base.html" %}
{% block title %}Додати книгу — Буккросинг{% endblock %}
{% block head %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
{% endblock %}
{% block content %}
<div class="page-header">
  <div class="container">
    <h1>📖 Додати книгу</h1>
    <p>Поділіться книгою з іншими учасниками</p>
  </div>
</div>

<div class="container" style="max-width:700px;">
  <div class="card">
    <div class="card-body">
      <div id="alert-container"></div>

      <div class="form-group">
        <label class="form-label">Назва книги *</label>
        <input type="text" id="title" class="form-control" placeholder="Введіть назву">
      </div>
      <div class="form-group">
        <label class="form-label">Автор *</label>
        <input type="text" id="author" class="form-control" placeholder="Ім'я автора">
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Жанр</label>
          <input type="text" id="genre" class="form-control" placeholder="Роман, детектив...">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Опис</label>
        <textarea id="description" class="form-control" rows="3" placeholder="Короткий опис книги..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Адреса розташування *</label>
        <input type="text" id="address" class="form-control" placeholder="Введіть адресу">
      </div>

      <div class="form-group">
        <label class="form-label">Оберіть місце на карті (клікніть) *</label>
        <div id="map" style="height:300px; border-radius:12px; margin-top:8px;"></div>
        <div class="mt-1 text-muted" id="coords-display">Місце не обрано</div>
      </div>

      <div class="form-group">
        <label class="form-label">Фото книги (необов'язково)</label>
        <input type="file" id="photo" class="form-control" accept="image/*">
      </div>

      <button class="btn btn-primary w-100 mt-2" onclick="addBook()">📖 Додати книгу</button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
if (!isLoggedIn()) window.location.href = '/login';

let selectedLat = null, selectedLon = null;
let marker = null;

const map = L.map('map').setView([49.8397, 24.0297], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

map.on('click', e => {
  selectedLat = e.latlng.lat;
  selectedLon = e.latlng.lng;
  if (marker) map.removeLayer(marker);
  marker = L.marker([selectedLat, selectedLon]).addTo(map);
  document.getElementById('coords-display').textContent =
    `📍 Обрано: ${selectedLat.toFixed(4)}, ${selectedLon.toFixed(4)}`;
});

// Геолокація
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(pos => {
    map.setView([pos.coords.latitude, pos.coords.longitude], 14);
  });
}

async function addBook() {
  const title = document.getElementById('title').value.trim();
  const author = document.getElementById('author').value.trim();
  const genre = document.getElementById('genre').value.trim();
  const description = document.getElementById('description').value.trim();
  const address = document.getElementById('address').value.trim();

  if (!title || !author) {
    showAlert('alert-container', 'Заповніть назву та автора');
    return;
  }
  if (!selectedLat || !selectedLon) {
    showAlert('alert-container', 'Оберіть місце на карті');
    return;
  }

  const body = { title, author, latitude: selectedLat, longitude: selectedLon };
  if (genre) body.genre = genre;
  if (description) body.description = description;
  if (address) body.address = address;

  const res = await apiPost('/books/', body);
  if (!res) return;

  if (res.ok) {
    const book = await res.json();

    // Завантажити фото якщо є
    const photoFile = document.getElementById('photo').files[0];
    if (photoFile) {
      const formData = new FormData();
      formData.append('file', photoFile);
      await fetch(`/api/v1/books/${book.id}/photo`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${getToken()}` },
        body: formData
      });
    }

    showAlert('alert-container', 'Книгу успішно додано!', 'success');
    setTimeout(() => window.location.href = `/book/${book.id}`, 1000);
  } else {
    const err = await res.json();
    showAlert('alert-container', err.detail || 'Помилка при додаванні');
  }
}
</script>
{% endblock %}
