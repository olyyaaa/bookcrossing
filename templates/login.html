 {% extends "base.html" %}
{% block title %}Вхід — Буккросинг{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h2>👋 Вхід в систему</h2>
    <div id="alert-container"></div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" id="email" class="form-control" placeholder="your@email.com">
    </div>
    <div class="form-group">
      <label class="form-label">Пароль</label>
      <input type="password" id="password" class="form-control" placeholder="••••••••">
    </div>
    <button class="btn btn-primary w-100 mt-2" onclick="login()">Увійти</button>
    <p class="text-center mt-2 text-muted">
      Немає акаунту? <a href="/register" style="color:#4f6ef7;">Зареєструватись</a>
    </p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    showAlert('alert-container', 'Заповніть всі поля');
    return;
  }

  const res = await apiPost('/auth/login', { email, password }, false);
  if (!res) return;

  if (res.ok) {
    const data = await res.json();
    setToken(data.access_token);

    // Отримати профіль
    const profileRes = await apiGet('/users/me');
    if (profileRes && profileRes.ok) {
      const user = await profileRes.json();
      setUser(user);
    }
    window.location.href = '/';
  } else {
    const err = await res.json();
    showAlert('alert-container', err.detail || 'Невірний email або пароль');
  }
}

// Enter для входу
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});

// Якщо вже залогінений
if (isLoggedIn()) window.location.href = '/';
</script>
{% endblock %}
